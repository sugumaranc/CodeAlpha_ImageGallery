<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Gallery</h1>

<div class="gallery">
    <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=800&auto=format&fit=crop" onclick="openImage(0)">
    <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?w=800&auto=format&fit=crop" onclick="openImage(1)">
    <img src= "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&auto=format&fit=crop" onclick="openImage(2)">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800&auto=format&fit=crop" onclick="openImage(3)">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&auto=format&fit=crop" onclick="openImage(4)">
   <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800&auto=format&fit=crop"  onclick="openImage(5)">
   <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800&auto=format&fit=crop"  onclick="openImage(6)">
    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&auto=format&fit=crop" onclick="openImage(7)">
    <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b?w=800&auto=format&fit=crop" onclick="openImage(8)">
</div>

<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeImage()">&times;</span>

    <button class="prev" onclick="prevImage()">❮</button>

    <img id="lightbox-img">

    <button class="next" onclick="nextImage()">❯</button>
</div>

<script src="script.js"></script>

</body>
</html>
